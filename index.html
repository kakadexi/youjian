<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>✨卡卡的西✨ · 玻璃时空邮箱</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        /* 玻璃质感核心变量 —— iOS通透基调 */
        :root {
            --glass-white: rgba(255, 255, 255, 0.55);
            --glass-dark: rgba(20, 25, 45, 0.68);
            --border-light: rgba(255, 255, 255, 0.5);
            --border-dark: rgba(255, 255, 255, 0.12);
            --shadow-soft: 0 15px 35px -12px rgba(0, 0, 0, 0.2), 0 0 0 0.5px rgba(255, 255, 255, 0.3) inset;
            --text-light: #1a2c3e;
            --text-secondary-light: #4e6a8a;
            --accent-gold: #ff9f4a;
        }

        body {
            font-family: -apple-system, 'SF Pro Text', 'Segoe UI', system-ui, Helvetica, sans-serif;
            background: radial-gradient(circle at 20% 30%, rgba(200, 220, 250, 0.9), rgba(160, 185, 225, 0.8));
            min-height: 100vh;
            color: var(--text-light);
            backdrop-filter: blur(2px);
            transition: background 0.3s, color 0.2s;
        }

        /* 暗色模式 · 深邃玻璃 */
        body.dark {
            background: radial-gradient(circle at 70% 20%, #0f172f, #030617);
            color: #f0f3fc;
        }

        body.dark .glass-card,
        body.dark .search-header,
        body.dark .results-container,
        body.dark .msg-item,
        body.dark .mail-display,
        body.dark .btn,
        body.dark .theme-toggle {
            --text-light: #f0f3fc;
            --text-secondary-light: #b9c5e0;
        }

        /* 通用玻璃卡片 */
        .glass-card {
            background: var(--glass-white);
            backdrop-filter: blur(26px) saturate(180%);
            -webkit-backdrop-filter: blur(26px) saturate(180%);
            border-radius: 36px;
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-soft);
            transition: all 0.25s ease;
        }

        body.dark .glass-card {
            background: var(--glass-dark);
            border-color: var(--border-dark);
            box-shadow: 0 12px 30px -12px rgba(0, 0, 0, 0.5), 0 0 0 0.5px rgba(255, 255, 255, 0.07) inset;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 80px 20px 40px;
        }

        /* 头像区域 — GIF 玻璃圈 */
        .avatar-wrapper {
            width: 100px;
            height: 100px;
            margin: 8px auto 16px;
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(12px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 10px 22px rgba(0, 0, 0, 0.12), 0 0 0 3px rgba(255, 255, 255, 0.6);
            transition: 0.2s;
        }

        .avatar-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        body.dark .avatar-wrapper {
            background: rgba(40, 48, 70, 0.65);
            box-shadow: 0 10px 22px rgba(0, 0, 0, 0.3), 0 0 0 3px rgba(255, 255, 255, 0.2);
        }

        /* 主标题渐变 + ✨ 璀璨 */
        .glow-title {
            font-size: 2.5rem;
            font-weight: 720;
            letter-spacing: -0.5px;
            background: linear-gradient(125deg, #FFB347, #FF6A88, #AA6FF9, #48B5FF);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 4s linear infinite;
            display: inline-block;
            padding: 0 6px;
        }

        @keyframes shimmer {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        .search-header {
            text-align: center;
            padding: 32px 28px;
            margin-bottom: 26px;
        }

        .subhead {
            color: var(--text-secondary-light);
            font-size: 0.85rem;
            font-weight: 470;
            margin-top: 8px;
            letter-spacing: 0.3px;
        }

        /* 邮箱地址条 — 毛玻璃高亮 */
        .mail-display {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(20px);
            padding: 14px 24px;
            border-radius: 80px;
            font-family: 'SF Mono', 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            font-weight: 540;
            margin: 22px 0;
            border: 0.5px solid rgba(255, 255, 255, 0.7);
            word-break: break-all;
            text-align: center;
            color: var(--text-light);
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.02), 0 4px 12px rgba(0,0,0,0.03);
        }

        body.dark .mail-display {
            background: rgba(0, 0, 0, 0.45);
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* 按钮组 — 清透玻璃态 */
        .btn-group {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            min-width: 125px;
            padding: 12px 26px;
            border-radius: 50px;
            font-weight: 590;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            background: rgba(245, 248, 255, 0.7);
            backdrop-filter: blur(12px);
            color: #1e2f4b;
            border: 0.5px solid rgba(255,255,240,0.7);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
        }

        body.dark .btn {
            background: rgba(35, 45, 72, 0.7);
            color: #eef2ff;
            border-color: rgba(255,255,255,0.15);
        }

        .btn-primary {
            background: linear-gradient(115deg, #2f5f8c, #1f4470);
            color: white;
            border: none;
            box-shadow: 0 6px 14px rgba(30, 60, 114, 0.25);
        }

        body.dark .btn-primary {
            background: linear-gradient(115deg, #3f75aa, #2a5888);
        }

        .btn:active {
            transform: scale(0.96);
        }

        /* 收件箱区域 */
        .results-container {
            padding: 20px 22px 28px;
            min-height: 380px;
        }

        .results-title {
            font-size: 0.85rem;
            font-weight: 590;
            margin-bottom: 20px;
            padding-left: 12px;
            border-left: 4px solid var(--accent-gold);
            color: var(--text-secondary-light);
            letter-spacing: -0.2px;
        }

        /* 邮件卡片玻璃质感 */
        .msg-item {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(16px);
            border-radius: 28px;
            padding: 18px 22px;
            margin-bottom: 16px;
            border: 0.5px solid rgba(255, 255, 250, 0.65);
            transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        }

        body.dark .msg-item {
            background: rgba(30, 38, 62, 0.55);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .msg-item:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.7);
            border-color: rgba(255, 190, 100, 0.7);
            box-shadow: 0 14px 28px -12px rgba(0, 0, 0, 0.18);
        }

        body.dark .msg-item:hover {
            background: rgba(55, 70, 105, 0.75);
        }

        .msg-from {
            font-size: 0.7rem;
            font-weight: 600;
            color: #e07a2c;
            margin-bottom: 6px;
            letter-spacing: -0.2px;
        }

        body.dark .msg-from {
            color: #ffb25e;
        }

        .msg-subject {
            font-weight: 680;
            font-size: 1rem;
            color: var(--text-light);
            margin-bottom: 6px;
        }

        .msg-preview {
            font-size: 0.78rem;
            color: var(--text-secondary-light);
            margin-top: 8px;
            opacity: 0.85;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 模态窗口 — iOS 高级玻璃 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(32px);
            z-index: 200;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: rgba(245, 248, 253, 0.94);
            backdrop-filter: blur(40px);
            width: 100%;
            max-width: 680px;
            height: 85vh;
            border-radius: 48px;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 245, 0.8);
            box-shadow: 0 25px 50px -12px black;
            overflow: hidden;
        }

        body.dark .modal-content {
            background: rgba(18, 24, 44, 0.94);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .modal-header {
            padding: 20px 26px;
            border-bottom: 0.5px solid rgba(0, 0, 0, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: transparent;
        }

        body.dark .modal-header {
            border-bottom-color: rgba(255, 255, 255, 0.1);
        }

        .modal-body {
            flex: 1;
            overflow-y: auto;
            padding: 24px 28px;
            background: rgba(255, 255, 255, 0.85);
            color: #1f2a44;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        body.dark .modal-body {
            background: rgba(30, 36, 58, 0.88);
            color: #eef2ff;
        }

        .close-btn {
            background: rgba(150, 170, 200, 0.3);
            backdrop-filter: blur(8px);
            border: none;
            padding: 8px 24px;
            border-radius: 50px;
            font-weight: 590;
            cursor: pointer;
            color: var(--text-light);
            transition: 0.2s;
        }

        /* 主题切换键 */
        .theme-toggle {
            position: fixed;
            top: 22px;
            right: 22px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 255, 245, 0.65);
            backdrop-filter: blur(22px);
            border: 0.5px solid rgba(255, 255, 255, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 101;
            font-size: 1.6rem;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.08);
        }

        body.dark .theme-toggle {
            background: rgba(30, 38, 58, 0.7);
        }

        /* 占位提示 */
        .empty-placeholder {
            text-align: center;
            padding: 55px 20px;
            color: var(--text-secondary-light);
            font-weight: 450;
            backdrop-filter: blur(4px);
        }

        /* 自适应 */
        @media (max-width: 640px) {
            .container {
                padding-top: 70px;
            }
            .glow-title {
                font-size: 2rem;
            }
            .btn {
                min-width: 108px;
                padding: 10px 18px;
            }
            .msg-item {
                padding: 14px 18px;
            }
            .modal-content {
                max-width: 92%;
                height: 80vh;
            }
        }
    </style>
</head>
<body>

    <!-- 主题切换按钮 -->
    <div class="theme-toggle" id="themeToggle">🌙</div>

    <div class="container">
        <div class="search-header glass-card">
            <div class="avatar-wrapper">
                <img src="https://mpimg.cn/view.php/8250a075b9a1a425410ef647221b846c.gif" alt="✨卡卡的西✨">
            </div>
            <h1>
                <span class="glow-title">✨卡卡的西✨</span>
            </h1>
            <p class="subhead">🍃 玻璃瞬焚 · 隐私信使 · 纯粹极简</p>
            <div id="addr" class="mail-display">🌀 正在生成玻璃邮箱...</div>
            <div class="btn-group">
                <button id="copyBtn" class="btn">📋 复制地址</button>
                <button id="refreshBtn" class="btn btn-primary">🔄 更换地址</button>
            </div>
        </div>

        <div class="results-container glass-card">
            <div class="results-title">📬 实时收件箱 · 阅后即隐</div>
            <div id="list">
                <div class="empty-placeholder">✨ 等待新邮件如星光飘入 ✨</div>
            </div>
        </div>
    </div>

    <!-- 邮件详情弹窗 -->
    <div id="mailModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span id="modalSubject" style="font-weight: 630; font-size: 1.05rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 70%;">📩 邮件细节</span>
                <button class="close-btn" id="closeModalBtn">关闭</button>
            </div>
            <div id="modalBody" class="modal-body">✨ 加载信件内容中 ✨</div>
        </div>
    </div>

    <script>
        // --------------------------------------------------------------
        //  ✨卡卡的西✨ 临时邮箱 (mail.tm 玻璃重构版)
        //  功能: 创建临时邮箱, 自动轮询邮件, 阅读详情, 更换地址, 完全无音乐
        // --------------------------------------------------------------
        const API_BASE = "https://api.mail.tm";
        let currentAccount = { address: "", password: "", token: "" };
        let pollInterval = null;
        let isRefreshing = false;

        // DOM 元素
        const addrEl = document.getElementById('addr');
        const listContainer = document.getElementById('list');
        const copyBtn = document.getElementById('copyBtn');
        const refreshBtn = document.getElementById('refreshBtn');
        const themeToggle = document.getElementById('themeToggle');
        const modal = document.getElementById('mailModal');
        const modalSubject = document.getElementById('modalSubject');
        const modalBody = document.getElementById('modalBody');
        const closeModalBtn = document.getElementById('closeModalBtn');

        // ---------- 辅助函数 ----------
        function showToast(msg, isError = false) {
            const toast = document.createElement('div');
            toast.innerText = msg;
            toast.style.position = 'fixed';
            toast.style.bottom = '30px';
            toast.style.left = '50%';
            toast.style.transform = 'translateX(-50%)';
            toast.style.backgroundColor = isError ? 'rgba(180, 60, 50, 0.85)' : 'rgba(0, 0, 0, 0.75)';
            toast.style.backdropFilter = 'blur(20px)';
            toast.style.color = 'white';
            toast.style.padding = '10px 22px';
            toast.style.borderRadius = '44px';
            toast.style.fontSize = '14px';
            toast.style.fontWeight = '500';
            toast.style.zIndex = '999';
            toast.style.whiteSpace = 'nowrap';
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }

        // 清空邮件列表展示
        function setEmptyList(message = "📭 暂无邮件 · 快用复制地址接收吧 ✨") {
            listContainer.innerHTML = `<div class="empty-placeholder">${message}</div>`;
        }

        // 停止轮询
        function stopPolling() {
            if (pollInterval) {
                clearInterval(pollInterval);
                pollInterval = null;
            }
        }

        // 渲染邮件列表 (按时间倒序:最新在上)
        function renderMessages(messages) {
            if (!messages || messages.length === 0) {
                setEmptyList();
                return;
            }
            // 按 createdAt 降序排列
            const sorted = [...messages].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
            const html = sorted.map(msg => {
                const fromAddr = msg.from?.address || "未知发件人";
                const subject = msg.subject || "（无主题）";
                const date = new Date(msg.createdAt).toLocaleString();
                const preview = (msg.intro || subject).substring(0, 80);
                return `
                    <div class="msg-item" data-id="${msg.id}">
                        <div class="msg-from">✉️ 来自: ${escapeHtml(fromAddr)} · ${date}</div>
                        <div class="msg-subject">${escapeHtml(subject)}</div>
                        <div class="msg-preview">✨ ${escapeHtml(preview)}...</div>
                    </div>
                `;
            }).join('');
            listContainer.innerHTML = html;

            // 绑定邮件点击事件 (事件委托)
            document.querySelectorAll('.msg-item').forEach(el => {
                el.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = el.getAttribute('data-id');
                    if (id) fetchMailDetail(id);
                });
            });
        }

        // 获取邮件列表 (基于当前token)
        async function fetchMessages() {
            if (!currentAccount.token) return;
            try {
                const res = await fetch(`${API_BASE}/messages`, {
                    headers: { 'Authorization': `Bearer ${currentAccount.token}` }
                });
                if (!res.ok) {
                    if (res.status === 401) {
                        // token失效，尝试重新登陆
                        await relogin();
                    }
                    return;
                }
                const data = await res.json();
                const messages = data['hydra:member'] || [];
                if (messages.length) {
                    renderMessages(messages);
                } else {
                    if (listContainer.querySelector('.msg-item') === null) {
                        setEmptyList();
                    }
                }
            } catch (err) {
                console.warn("fetch messages err", err);
            }
        }

        // 重新登录 (令牌刷新)
        async function relogin() {
            if (!currentAccount.address || !currentAccount.password) return false;
            try {
                const tokenRes = await fetch(`${API_BASE}/token`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        address: currentAccount.address,
                        password: currentAccount.password
                    })
                });
                if (tokenRes.ok) {
                    const tokenData = await tokenRes.json();
                    currentAccount.token = tokenData.token;
                    return true;
                }
            } catch(e) {}
            return false;
        }

        // 获取邮件详细内容
        async function fetchMailDetail(messageId) {
            if (!currentAccount.token) {
                showToast("邮箱尚未就绪", true);
                return;
            }
            modal.style.display = 'flex';
            modalBody.innerHTML = '<div style="text-align:center;padding:40px;">🌀 解读信件中 ...</div>';
            modalSubject.innerText = "加载详情...";
            try {
                const res = await fetch(`${API_BASE}/messages/${messageId}`, {
                    headers: { 'Authorization': `Bearer ${currentAccount.token}` }
                });
                if (!res.ok) throw new Error("无法获取邮件");
                const detail = await res.json();
                modalSubject.innerText = detail.subject || "邮件内容";
                let content = "";
                if (detail.html && detail.html.length) {
                    content = detail.html[0];
                } else if (detail.text) {
                    content = `<div style="white-space: pre-wrap; font-family: -apple-system;">${escapeHtml(detail.text)}</div>`;
                } else {
                    content = "<div>✨ 这封邮件没有正文，但饱含灵感 ✨</div>";
                }
                modalBody.innerHTML = content;
            } catch (err) {
                modalBody.innerHTML = '<div style="text-align:center;padding:40px;">❌ 读取失败，轻触重试或关闭</div>';
                console.error(err);
            }
        }

        // 简易防XSS
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // 核心：创建全新临时邮箱
        async function createNewMailbox() {
            try {
                // 获取可用域名
                const domainRes = await fetch(`${API_BASE}/domains`);
                const domainsData = await domainRes.json();
                const domain = domainsData['hydra:member'][0]?.domain;
                if (!domain) throw new Error("无法获取域名");

                const randomUser = Math.random().toString(36).substring(2, 14) + Date.now().toString(36);
                const password = Math.random().toString(36) + Math.random().toString(36);
                const address = `${randomUser}@${domain}`;

                // 创建账户
                const createRes = await fetch(`${API_BASE}/accounts`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ address, password })
                });
                if (!createRes.ok) {
                    const errMsg = await createRes.text();
                    throw new Error(`创建账户失败: ${errMsg}`);
                }

                // 获取 token
                const tokenRes = await fetch(`${API_BASE}/token`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ address, password })
                });
                if (!tokenRes.ok) throw new Error("获取 token 失败");
                const tokenData = await tokenRes.json();

                return { address, password, token: tokenData.token };
            } catch (err) {
                console.error("create mailbox error:", err);
                throw err;
            }
        }

        // 初始化 / 更换邮箱入口
        async function initMail(showReplaceMsg = true) {
            if (isRefreshing) return;
            isRefreshing = true;
            stopPolling();

            addrEl.innerText = "✨ 正在铸造玻璃邮箱 ✨";
            setEmptyList("⚡ 生成全新临时地址中...");

            try {
                const newAccount = await createNewMailbox();
                currentAccount = newAccount;
                addrEl.innerText = currentAccount.address;
                // 首次拉取邮件
                await fetchMessages();
                // 启动轮询 (5s)
                if (pollInterval) clearInterval(pollInterval);
                pollInterval = setInterval(() => fetchMessages(), 5000);
                if (showReplaceMsg) showToast("✨ 新邮箱已就绪，复制即用");
            } catch (err) {
                console.error(err);
                addrEl.innerText = "⚠️ 生成失败，请检查网络后更换地址";
                setEmptyList("❌ 服务暂时波动，点击「更换地址」重试");
                showToast("连接 mail.tm 失败，请稍后重试", true);
            } finally {
                isRefreshing = false;
            }
        }

        // 手动更换地址（完全重置）
        async function replaceMail() {
            if (isRefreshing) {
                showToast("正在更换中，请稍后", true);
                return;
            }
            await initMail(true);
        }

        // 复制当前邮箱地址
        function copyCurrentAddress() {
            if (!currentAccount.address || currentAccount.address.includes("铸造")) {
                showToast("邮箱尚未生成，请稍后重试", true);
                return;
            }
            navigator.clipboard.writeText(currentAccount.address).then(() => {
                showToast("✨ 卡卡的西邮箱地址已复制 ✨");
            }).catch(() => {
                showToast("手动复制吧: " + currentAccount.address);
            });
        }

        // 关闭模态框
        function closeModal() {
            modal.style.display = 'none';
        }

        // ----- 夜间模式切换 (保持通透感)-----
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark');
            const isDark = document.body.classList.contains('dark');
            themeToggle.textContent = isDark ? '☀️' : '🌙';
        });

        // ----- 绑定UI事件 -----
        copyBtn.addEventListener('click', copyCurrentAddress);
        refreshBtn.addEventListener('click', replaceMail);
        closeModalBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        // 页面启动，创建邮箱
        window.addEventListener('DOMContentLoaded', () => {
            initMail(true);
        });

        // 页面关闭前清除轮询
        window.addEventListener('beforeunload', () => {
            if (pollInterval) clearInterval(pollInterval);
        });

        // 暴露部分调试不用，但保留优雅错误恢复
        window.replaceMail = replaceMail;
    </script>
</body>
</html>
